name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            artifact: dmm-linux-x64.tar.gz
          - os: windows-2025
            platform: windows-x64
            artifact: dmm-windows-x64.zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libfontconfig1-dev libwayland-dev libxcb1-dev libxkbcommon-dev pkg-config

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release
        run: cargo build --locked --release

      - name: Test archive extraction
        run: cargo test --locked --release --lib "archive::"

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          ./target/release/dmm --help
          tar -czf dmm-linux-x64.tar.gz -C packaging licenses -C .. LICENSE.md -C target/release dmm
          bash packaging/appimage/build.sh target/release/dmm dmm-linux-x64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./dmm-linux-x64.AppImage --help

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/dmm.exe -Destination dist
          Copy-Item packaging/licenses -Destination dist -Recurse
          Copy-Item LICENSE.md -Destination dist
          & .\dist\dmm.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath dmm-windows-x64.zip

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          archive: false
          overwrite: true

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dmm-linux-x64.AppImage
          if-no-files-found: error
          archive: false
          overwrite: true

  release:
    name: Create draft release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dmm-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Attach builds and checksums to draft
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(dmm-linux-x64.AppImage dmm-linux-x64.tar.gz dmm-windows-x64.zip)
          sha256sum "${assets[@]}" > SHA256SUMS
          gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS \
            --draft --verify-tag --title "$RELEASE_TAG" --notes ""
