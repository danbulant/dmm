[package]
name = "dmm"
version = "0.1.0"
edition = "2024"

[features]
rune-ui = ["dep:image", "dep:rune", "dep:rune-kit", "rune/native-file-dialog"]
default = ["rune-ui"]
[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"], optional = true }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4", default-features = false, features = ["embedded-fonts"], optional = true }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4", default-features = false, optional = true }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamlocate = "2"
tempfile = "3"
toml = "0.9"
url = { version = "2", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ring = "0.17"

# Rune's git workspace patches are not inherited by Cargo consumers.
[patch.crates-io]
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4" }
winit = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4" }

[profile.dev]
debug = 0

[profile.test]
debug = 0
